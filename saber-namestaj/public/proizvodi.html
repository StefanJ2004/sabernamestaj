<!doctype html>

<head>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Šaber nameštaj">

<meta property="og:description" content="Stolice, barske stolice i fotelje od masiva i savijene bukve. Pogledajte kolekcije i proizvode spremne za isporuku.">
<meta property="og:image" content="https://images.unsplash.com/photo-1768203634842-ece3bb915cc1?w=1200&amp;q=70&amp;auto=format&amp;h=630&amp;fit=crop">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var l=localStorage.getItem('saber_lang')||(/^(sr|hr|bs|sh|cnr|me)/i.test(navigator.language)?'sr':'en');if(l!=='sr'){document.documentElement.classList.add('i18n-wait');document.documentElement.lang=l}}catch(e){}</script>
<script src="/assets/js/app.js?v=1" defer></script>
<script src="/assets/js/pages.js?v=1" defer></script>
<script>if(/[?&]lager=1/.test(location.search))document.documentElement.dataset.ready=1</script>
</head>
<body data-page="products" data-title-key="title.products">
<a class="skip-link" href="#main">Preskoči na sadržaj</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="page-head">
  <div class="container">
    <span class="eyebrow" data-mode-all data-i18n="products.eyebrow">Kolekcije</span>
    <span class="eyebrow" data-mode-ready hidden data-i18n="products.readyEyebrow">Na lageru</span>
    <h1><span data-mode-all data-i18n="products.title">Proizvodi</span><span data-mode-ready hidden data-i18n="products.readyTitle">Spremno za isporuku</span></h1>
    <p class="lead" data-mode-all data-i18n="products.lead">Svaka stolica se izrađuje po porudžbini — od masiva i savijene bukve, u materijalu i završnici po vašem izboru.</p>
    <p class="lead" data-mode-ready hidden data-i18n="products.readyLead">Stolice koje su trenutno na lageru i mogu se isporučiti odmah, bez čekanja na izradu.</p>
  </div>
</section>
<section class="container">
  <div class="toolbar">
    <div class="chips" id="chips-collection"></div>
    <div class="chips" id="chips-cat"></div>
    <label class="toggle"><input type="checkbox" id="f-stock"> <span data-i18n="products.onlyStock">Samo na lageru</span></label>
    <select id="f-sort" aria-label="Sortiranje">
      <option value="new" data-i18n="products.sortNew">Najnovije</option>
      <option value="name" data-i18n="products.sortName">Po nazivu</option>
    </select>
    <span class="count" id="product-count"></span>
  </div>
  <p id="q-note" class="muted"></p>
  <div class="grid" id="product-grid"><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div><div><div class="card-media skeleton"></div></div></div>
</section>
<div class="section"></div>
</main>
<footer id="site-footer"></footer>
</body>
</html>
